#
# Jenny Script fork CI.
# Builds without private submodules or Crashpad (CONFIG+=no_crashpad). The only secrets are the
# OAuth client of the app. Nothing is published outside of this repository's workflow artifacts.
#
name: Build Jenny Script

env:
  QT_VERSION: 6.11.2
  QT_MODULES: qt5compat qtimageformats qtmultimedia qtspeech qtwebsockets qtnetworkauth
  # needed until miurahr/aqtinstall#1007 ships 3.3.1 for Qt >= 6.11.0 (same pin as upstream)
  AQT_SOURCE: aqtinstall @ git+https://github.com/miurahr/aqtinstall@16db45a70b5905ad596941b223469bc86a56901e
  # OAuth client of the app; qmake reads it for core.pro during the build step (empty for PRs
  # from other forks, Google sign in is disabled then)
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

on:
  push:
    branches: [ master, 'phase-*' ]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (compile + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout public submodules only (no private plugins)
        shell: bash
        run: |
          git submodule update --init --recursive src/3rd_party/pdfhummus src/3rd_party/pdftextextraction src/3rd_party/qtkeychain

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y libgstreamer-plugins-base1.0-0 make pkg-config libx11-dev xcb libx11-xcb-dev libxkbcommon-x11-0 libxkbcommon-dev libgtk-3-dev libxcb-cursor0 zlib1g-dev

      - name: Compile fork translations
        shell: bash
        run: |
          lrelease src/core/translations/translation_vi.ts -qm src/core/translations/translation_vi.qm

      - name: Run QMake
        shell: bash
        run: |
          cd src
          qmake starc.pro CONFIG+=release CONFIG+=no_crashpad

      - name: Build
        shell: bash
        run: |
          cd src
          make -j$(nproc)

      - name: Build tests
        shell: bash
        run: |
          mkdir -p work/remote-text-tests
          cd work/remote-text-tests
          qmake ../../tests/remote_text_changes/remote_text_changes.pro CONFIG+=release
          make -j$(nproc)

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd work/remote-text-tests
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src/_build:$GITHUB_WORKSPACE/src/_build/libs:$GITHUB_WORKSPACE/src/_build/plugins${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./tst_remote_text_changes

      - name: Build and run Google Drive client tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p work/google-drive-client-tests
          cd work/google-drive-client-tests
          qmake ../../tests/google_drive_client/google_drive_client.pro CONFIG+=release
          make -j$(nproc)
          ./tst_google_drive_client

      - name: Build and run Fountain import tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p work/fountain-import-tests
          cd work/fountain-import-tests
          qmake ../../tests/fountain_import/fountain_import.pro CONFIG+=release
          make -j$(nproc)
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src/_build:$GITHUB_WORKSPACE/src/_build/libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./tst_fountain_import

      - name: Build and run scroll bar drag tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p work/scrollbar-drag-tests
          cd work/scrollbar-drag-tests
          qmake ../../tests/scrollbar_drag/scrollbar_drag.pro CONFIG+=release
          make -j$(nproc)
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/src/_build:$GITHUB_WORKSPACE/src/_build/libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./tst_scrollbar_drag

      - name: Build and run app update tests
        shell: bash
        run: |
          mkdir -p work/app-update-tests
          cd work/app-update-tests
          qmake ../../tests/app_update/app_update.pro CONFIG+=release
          make -j$(nproc)
          ./tst_app_update

  windows:
    name: Windows x64 (portable zip)
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout public submodules only (no private plugins)
        shell: bash
        run: |
          git submodule update --init --recursive src/3rd_party/pdfhummus src/3rd_party/pdftextextraction src/3rd_party/qtkeychain

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          target: desktop
          setup-python: false
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          choco install openssl --version=3.1.1 --force
          choco install jom

      - name: Create OpenSSL path without spaces
        shell: pwsh
        run: |
          New-Item -ItemType Junction -Path 'C:\OpenSSL' -Target 'C:\Program Files\OpenSSL' -Force
          "OPENSSL_PREFIX=C:\OpenSSL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile fork translations
        shell: bash
        run: |
          lrelease src/core/translations/translation_vi.ts -qm src/core/translations/translation_vi.qm

      - name: Run QMake
        shell: bash
        run: |
          cd src
          qmake starc.pro CONFIG+=release CONFIG+=no_crashpad

      - name: Build
        run: |
          cd src
          jom -j4

      - name: Prepare portable folder
        shell: bash
        run: |
          cd build/windows
          ./make-exe_64.sh 0.0.0
          # Crashpad is not built in the fork
          rmdir files_64/crashpad 2>/dev/null || true
          # Qt modules used by the fork only
          cp "$QT_ROOT_DIR/bin/Qt6NetworkAuth.dll" files_64/
          # Licence and source notices (GPL-3.0 requires them next to the binaries)
          cp ../../LICENSE files_64/LICENSE.txt
          cp ../../NOTICE.txt files_64/NOTICE.txt
          mkdir -p files_64/licenses
          cp ../../src/3rd_party/pdfhummus/LICENSE files_64/licenses/pdfhummus.txt
          cp ../../src/3rd_party/pdftextextraction/LICENSE files_64/licenses/pdftextextraction.txt
          cp ../../src/3rd_party/qgumboparser/LICENSE files_64/licenses/qgumboparser.txt
          cp ../../src/3rd_party/qtkeychain/COPYING files_64/licenses/qtkeychain.txt
          cp ../../src/3rd_party/hunspell/COPYING files_64/licenses/hunspell.txt

      - name: Make release zip
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*kVersion\[\] = "\([^"]*\)".*/\1/p' src/core/management_layer/content/update/update_info.h)
          if [ -z "$VERSION" ]; then
            echo "Error: fork version not found in update_info.h"
            exit 1
          fi
          NAME="JennyScript-v$VERSION-windows-x64"
          python -I build/windows/make_release_zip.py build/windows/files_64 "build/windows/$NAME.zip" "$NAME"

      # Public record that this file was built here from this commit. It says where a file comes
      # from, not that the code is safe. Check: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest the release zip
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/windows/JennyScript-*-windows-x64.zip

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: jenny-script-windows-x64-zip
          path: build/windows/JennyScript-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: jenny-script-windows-x64-portable
          path: build/windows/files_64
          if-no-files-found: error

  macos:
    name: macOS universal (unsigned dmg)
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout public submodules only (no private plugins)
        shell: bash
        run: |
          git submodule update --init --recursive src/3rd_party/pdfhummus src/3rd_party/pdftextextraction src/3rd_party/qtkeychain

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          modules: ${{ env.QT_MODULES }}
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - name: Compile fork translations
        shell: bash
        run: |
          lrelease src/core/translations/translation_vi.ts -qm src/core/translations/translation_vi.qm

      - name: Run QMake
        shell: bash
        run: |
          cd src
          qmake starc.pro CONFIG+=release CONFIG+=no_crashpad QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64"

      - name: Build
        shell: bash
        run: |
          cd src
          make -j$(sysctl -n hw.ncpu)

      - name: Make dmg
        shell: bash
        run: |
          bash build/mac/make_fork_dmg.sh

      # Nobody on the team has a Mac: open the packaged app with Qt moved away, so a library that
      # is only present on this machine makes it fail here. The screenshot is for a human check.
      - name: Open the app from the dmg
        shell: bash
        run: |
          mkdir -p work/macos-smoke
          MOUNT=$(mktemp -d)
          hdiutil attach build/mac/JennyScript-*-macos.dmg -nobrowse -mountpoint "$MOUNT"
          ditto "$MOUNT/Jenny Script.app" "work/macos-smoke/Jenny Script.app"
          hdiutil detach "$MOUNT"
          mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"
          trap 'mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"' EXIT
          "work/macos-smoke/Jenny Script.app/Contents/MacOS/starcapp" > work/macos-smoke/app.log 2>&1 &
          APP_PID=$!
          sleep 45
          screencapture -x work/macos-smoke/screen.png || echo "Screenshot not available"
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "Error: the app closed by itself"
            cat work/macos-smoke/app.log
            exit 1
          fi
          kill "$APP_PID"
          cat work/macos-smoke/app.log

      - name: Upload the app check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenny-script-macos-check
          path: |
            work/macos-smoke/app.log
            work/macos-smoke/screen.png
          if-no-files-found: warn

      # See the note in the Windows job
      - name: Attest the dmg
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/mac/JennyScript-*-macos.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: jenny-script-macos-dmg
          path: build/mac/JennyScript-*-macos.dmg
          if-no-files-found: error
          compression-level: 0
